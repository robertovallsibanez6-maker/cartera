<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cartera</title>
<meta name="description" content="Seguimiento de inversiones: posiciones, análisis, dividendos y objetivo.">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cartera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="page-title">Resumen</h1>
      <div class="updated" id="updated-label">Cargando precios…</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-refresh" aria-label="Actualizar precios" title="Actualizar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="resumen" class="tab active"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Resumen</span></button>
    <button data-tab="posiciones" class="tab"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M4 15l5-5 4 4 7-7"/></svg><span>Posiciones</span></button>
    <button data-tab="analisis" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 4"/></svg><span>Análisis</span></button>
    <button data-tab="calendario" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendario</span></button>
    <button data-tab="objetivo" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span>Objetivo</span></button>
    <button data-tab="operaciones" class="tab"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Operaciones</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
